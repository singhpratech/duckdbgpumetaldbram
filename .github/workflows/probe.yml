name: probe (ctrl-d diagnosis, throwaway)

on:
  push:
    branches: ['ci/shell-ctrl-d-diagnosis']

jobs:
  window:
    name: what a terminal does with a ^D nobody is reading
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 python/tests/probe_eof_window.py

  loop:
    name: ${{ matrix.mode }} load=${{ matrix.load }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [old, fixed, real]
        load: [0, 8]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet duckdb py-spy
          python3 -c "import readline; print(readline.__doc__, getattr(readline, '_READLINE_LIBRARY_VERSION', '?'))"
          nproc
      - name: loop
        env:
          PROBE_LOAD: ${{ matrix.load }}
        run: |
          case "${{ matrix.mode }}" in
            old)   python3 python/tests/probe_ctrl_d.py 80 ;;
            fixed) python3 python/tests/probe_ctrl_d.py fixed 80 ;;
            real)  python3 python/tests/probe_ctrl_d.py real 80 ;;
          esac
