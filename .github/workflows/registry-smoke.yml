name: registry-smoke

# Nightly canary against the LIVE community registry: installs whatever
# binary `INSTALL gpudb FROM community` actually serves today and gates it on
# parity with native DuckDB. Catches registry/DuckDB breakage within a day,
# on both platforms users actually install on. The build-info step logs
# which backends the served binary carries, so any change in the registry
# build shows up in the job history.
#
# Deliberately version-agnostic in its hard gates (gpu_sum/min/max exist
# since v0.1); resident-surface probes are soft until the registry serves
# v0.4.0+.

on:
  schedule:
    - cron: "17 5 * * *"   # nightly, 05:17 UTC
  workflow_dispatch: {}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15      # Apple Silicon runner -> real Metal path
            label: metal
          - os: ubuntu-latest # CPU fallback (no GPU on hosted runners)
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install DuckDB CLI
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install duckdb
          else
            curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
            unzip -o duckdb.zip && sudo mv duckdb /usr/local/bin/
          fi
          duckdb --version

      - name: Install gpudb from the community registry
        run: duckdb -c "INSTALL gpudb FROM community; LOAD gpudb; SELECT 'load ok';"

      - name: Parity gate (hard fail on mismatch)
        run: |
          duckdb -c "
          LOAD gpudb;
          SELECT CASE WHEN gpu_sum(v) = sum(v) AND gpu_min(v) = min(v) AND gpu_max(v) = max(v)
                 THEN 'parity ok'
                 ELSE error('gpu/native mismatch') END
          FROM (SELECT (range * 7 - 500000)::BIGINT AS v FROM range(1000000)) t;
          "

      - name: DOUBLE parity (soft — needs registry v0.4.0+)
        continue-on-error: true
        run: |
          duckdb -c "
          LOAD gpudb;
          SELECT CASE WHEN abs(gpu_sum(d) - sum(d)) < 1e-6 THEN 'f64 parity ok'
                 ELSE error('gpu/native f64 mismatch') END
          FROM (SELECT (range / 3.0)::DOUBLE AS d FROM range(1000000)) t;
          " || echo "DOUBLE overloads not in served version yet (registry < v0.4.0)"

      - name: Build info (soft — needs registry v0.4.0+)
        continue-on-error: true
        run: |
          duckdb -c "LOAD gpudb; SELECT gpu_build_info();" || echo "gpu_build_info not in served version yet (registry < v0.4.0)"

      - name: Resident-surface probe (soft — needs registry v0.4.0+)
        continue-on-error: true
        run: |
          duckdb -c "
          LOAD gpudb;
          SELECT u.n, gpu_sum_resident('smoke') AS s
          FROM (SELECT gpu_upload('smoke', range::BIGINT) AS n FROM range(100000)) u;
          SELECT gpu_last_stats();
          " || echo "resident surface not in served version yet (registry < v0.4.0)"

      - name: Resident join parity (soft — needs registry v0.5.0+)
        continue-on-error: true
        run: |
          duckdb -c "
          LOAD gpudb;
          SELECT CASE WHEN gpu_join_sum_resident('p.k','p.v','b') = (SELECT sum(p.v) FROM (SELECT (range % 1000)::BIGINT AS k, range::BIGINT AS v FROM range(100000)) p JOIN (SELECT (range * 3 % 1000)::BIGINT AS k FROM range(500)) b ON p.k = b.k)
                 THEN 'join parity ok' ELSE error('gpu/native join mismatch') END, u1.n1, u2.n2
          FROM (SELECT gpu_upload_pair('p', (range % 1000)::BIGINT, range::BIGINT) AS n1 FROM range(100000)) u1,
               (SELECT gpu_upload('b', (range * 3 % 1000)::BIGINT) AS n2 FROM range(500)) u2;
          SELECT gpu_last_stats();
          " || echo "resident joins not in served version yet (registry < v0.5.0)"

      - name: Resident GROUP BY parity (soft — needs registry v0.6.0+)
        continue-on-error: true
        run: |
          duckdb -c "
          LOAD gpudb;
          CREATE TABLE src AS SELECT (range % 997)::BIGINT AS k, (range % 1000 - 500)::BIGINT AS v FROM range(200000);
          SELECT gpu_upload_pair('g', k, v) FROM src;
          SELECT CASE WHEN (SELECT count(*) FROM ((SELECT key, sum FROM gpu_groupby_sum_resident('g')) EXCEPT (SELECT k, sum(v) FROM src GROUP BY k))) = 0
                       AND (SELECT count(*) FROM gpu_groupby_sum_resident('g')) = 997
                 THEN 'group by parity ok' ELSE error('gpu/native group by mismatch') END;
          SELECT gpu_last_stats();
          " || echo "resident group by not in served version yet (registry < v0.6.0)"
