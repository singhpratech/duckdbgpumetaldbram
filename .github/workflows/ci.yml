name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-cpu:
    name: linux (cpu-only build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake libgomp1

      - name: configure (no CUDA)
        env:
          GPUDB_NO_CUDA: "1"
        run: |
          ./scripts/build.sh

      - name: run unit tests
        run: |
          ./build-linux/test/test_gpudb

      - name: smoke benchmark (synthetic, small)
        run: |
          ./build-linux/bin/gpudb-bench --rows 1000000 --runs 2 --mode both

      - name: smoke groupby benchmark
        run: |
          ./build-linux/bin/gpudb-groupby-bench --rows 1000000 --groups 1000 --runs 2

      - name: python wrapper packages and imports
        run: |
          python3 -m pip install --quiet --upgrade pip wheel
          python3 -m pip wheel ./python -w /tmp/gpudb-wheel --no-deps --quiet
          python3 -m pip install --quiet /tmp/gpudb-wheel/*.whl
          cd /tmp && python3 -c "import gpudb; con = gpudb.connect(); con.execute('SELECT 1').fetchall(); print('gpudb', gpudb.__version__, 'without an extension:', con.last_rewrite()['reason'])"

      - name: python shell tests (no extension here, so the plain-DuckDB path)
        run: |
          python3 python/tests/test_shell.py

      - name: python residency policy tests (no extension, no DuckDB needed)
        run: |
          python3 python/tests/test_residency_policy.py

      # --- the SQL suite, on x86-64 -------------------------------------
      # Everything above this line builds and runs code; nothing above it
      # checks a SQL ANSWER. That gap let a rule-2 bug (avg(BIGINT) finalised
      # differently from native) sit on main: x86-64 computes long double in
      # 80 bits, arm64 makes it a plain double, so the only machine that could
      # see the difference was the one machine not running the suite.
      #
      # gpudb-sql (and therefore ./scripts/run_sql_tests.sh) needs the
      # pre-built libduckdb, which build.sh detects and turns into
      # -DGPUDB_BUILD_EXT=ON. Fetched here, AFTER the steps above, so those
      # keep exercising the no-extension path they were written for.
      - name: fetch pre-built DuckDB libs (pinned; enables the extension + gpudb-sql)
        run: |
          sudo apt-get install -y --no-install-recommends unzip
          ./scripts/get_duckdb_libs.sh

      - name: build the extension and gpudb-sql
        env:
          GPUDB_NO_CUDA: "1"
        run: |
          ./scripts/build.sh

      # No GPU on hosted runners, so this is the CPU backend end to end: the
      # answers, not the plumbing. Queries tagged `-- requires_file:` (only
      # the TPC-H parquet one today) skip themselves when the data is absent.
      - name: SQL suite (test/sql/*.test, CPU backend)
        run: |
          ./scripts/run_sql_tests.sh

      # --- the Python wrapper, against the extension just built -------------
      # The SQL suite above runs statements a user writes by hand. This suite
      # is the only one that runs statements the WRAPPER wrote — it puts a
      # rewritten statement and native's next to each other and compares the
      # rows. Two bugs reached main in 2026-09 because nothing here ran it
      # against a built extension: a CTE hint the rewrite dropped under
      # DuckDB 1.5.5 but not 1.4.5, and a decline guard that was green on a
      # fixture and dead on the real path.
      #
      # The pip `duckdb` module is pinned to the same version as the libs
      # fetched above — read from the fetch script, so the pin lives in one
      # place — because the client renders statements through DuckDB's own
      # json_serialize_sql / json_deserialize_sql, whose output is a property
      # of that version.
      #
      # A hosted runner has no GPU, so the backend is CPU and the wrapper
      # never rewrites there (rule 1: the CPU resident path is slower than
      # native). The suite says so and skips the checks that need a device;
      # what runs here is the never-rewrite path over the whole corpus, the
      # decline reasons, and the client/extension version pin. Whatever runs
      # must pass — no failure is downgraded to a skip.
      - name: python wrapper suite (CPU backend, pip duckdb at the pinned version)
        run: |
          duckdb_tag="$(./scripts/get_duckdb_libs.sh --print-version)"
          python3 -m pip install --quiet "duckdb==${duckdb_tag#v}"
          # printed, not asserted: a LOAD failure below is a platform mismatch
          # between the module and the footer build.sh stamps on the .so
          python3 -c "import duckdb; c = duckdb.connect(); print('pip duckdb', duckdb.__version__, c.execute('SELECT * FROM pragma_platform()').fetchone()[0])"
          GPUDB_EXTENSION_PATH="$PWD/build-linux/src/extension/gpudb.linux_amd64.duckdb_extension" \
              python3 python/tests/test_wrapper.py

  macos-cpu-metal:
    name: macos (cpu + metal scaffold build)
    runs-on: macos-15   # Apple Silicon runner; needs SDK with MTLLanguageVersion3_2
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: |
          ./scripts/build.sh

      - name: run unit tests
        run: |
          ./build-macos/test/test_gpudb
