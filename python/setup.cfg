# Metadata for setuptools older than 61 (which cannot read [project] in pyproject.toml);
# keep in step with pyproject.toml.
[metadata]
name = duckdb-gpudb
version = 0.7.0
description = Plain DuckDB SQL on the GPU: a drop-in gpudb.connect() that answers statements on the device when that is faster, and lets DuckDB run everything else
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
url = https://github.com/singhpratech/duckdbgpumetaldbram

[options]
packages = find:
python_requires = >=3.9
install_requires =
    duckdb>=1.4

[options.packages.find]
include = gpudb*

[options.package_data]
gpudb = _ext/*.duckdb_extension

[options.entry_points]
console_scripts =
    gpudb = gpudb._shell:main
