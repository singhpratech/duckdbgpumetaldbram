[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duckdb-gpudb"
version = "0.7.0"
description = "Plain DuckDB SQL on the GPU: a drop-in gpudb.connect() that answers statements on the device when that is faster, and lets DuckDB run everything else"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["duckdb>=1.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.scripts]
gpudb = "gpudb._shell:main"

[project.urls]
Homepage = "https://github.com/singhpratech/duckdbgpumetaldbram"
Documentation = "https://github.com/singhpratech/duckdbgpumetaldbram/blob/main/docs/TRANSPARENT_DESIGN.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpudb*"]

# The extension binary, when one was bundled. `gpudb/_ext/` is empty in the
# repository and in the sdist: scripts/build_wheels.sh puts exactly one built
# `.duckdb_extension` there for the platform wheel and removes it again for the
# `py3-none-any` wheel. See setup.py for the wheel tag that goes with it.
#
# On Linux the same directory also gets libgomp.so.1 and its licence: the
# extension links OpenMP dynamically and a minimal userland has no copy, so the
# artifact carries one and finds it through its $ORIGIN runpath.
[tool.setuptools.package-data]
gpudb = ["_ext/*.duckdb_extension", "_ext/libgomp.so.*", "_ext/LICENSE.libgomp"]
